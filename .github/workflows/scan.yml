# Copy of .github/workflows/scan.yml in the PUBLIC repo tradingzoo/token-watch-runner (11 Nov 2026).
# Why: Actions minutes are free only on public repos (a scan is ~15-20 min, ~48 a day = ~25k min a month;
# a private repo gets 2k). This public file holds no data: it checks out the private repo with a token,
# runs run_scan.sh quietly (QUIET=1, nothing about tokens in the public log) and the script saves back to it.
# cron-job.org starts it every 30 min (POST .../token-watch-runner/actions/workflows/scan.yml/dispatches).
name: scan

on:
  schedule:
    - cron: "7,37 * * * *"   # backup only; cron-job.org is the main trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tradingzoo/token-watch
          ref: main
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/pons_launches.csv
            data/pons_launches_meta.json
          key: pons-launches-${{ github.run_id }}
          restore-keys: pons-launches-

      - name: Scan
        env:
          QUIET: "1"
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: bash run_scan.sh

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/pons_launches.csv
            data/pons_launches_meta.json
          key: pons-launches-${{ github.run_id }}
